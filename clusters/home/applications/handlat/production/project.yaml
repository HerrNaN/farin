apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: handlat-production
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  description: Handlat production deployment
  sourceRepos:
    - ghcr.io/herrnan/charts/stable
    - ghcr.io/herrnan/charts/devel
  destinations:
    - server: https://kubernetes.default.svc
      namespace: handlat-production
  # Allow namespace creation, but not cluster infrastructure such as PVs or RBAC.
  clusterResourceWhitelist:
    - group: ""
      kind: Namespace
  namespaceResourceWhitelist:
    - group: batch
      kind: CronJob
    - group: apps
      kind: Deployment
    - group: ""
      kind: Service
    - group: ""
      kind: PersistentVolumeClaim
    - group: networking.k8s.io
      kind: Ingress
